                    return { text: `${f(w1, n1, d1)} ÷ ${f(0, n2, d2)} ＝`, ans: ansStr, isHTML: true };
                }
                if (level === "4") {
                    // 【再設計：1列レイアウト連動】かけ算とわり算が混ざった3つの分数の複合計算
                    const triplePatterns = [
                        { text: `${f(0,1,3)} × ${f(0,2,5)} ÷ ${f(0,4,9)} ＝`, ans: f(0,3,10) },
                        { text: `${f(0,3,8)} ÷ ${f(0,9,10)} × ${f(0,4,5)} ＝`, ans: f(0,1,3) },
                        { text: `${f(0,5,6)} ÷ ${f(0,2,3)} ÷ ${f(0,1,4)} ＝`, ans: "5" },
                        { text: `${f(0,7,12)} × ${f(0,6,7)} ÷ ${f(0,3,4)} ＝`, ans: f(0,2,3) }
                    ];
                    const p = triplePatterns[Math.floor(Math.random() * triplePatterns.length)];
                    return { text: p.text, ans: p.ans, isHTML: true };
                }
            }

            // 3. 比の計算
            if (unit === "比の計算") {
                const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
                
                if (level === "1") {
                    // 基礎：比を最も簡単な整数の比にする（2数の公約数で割る）
                    let baseA = Math.floor(Math.random() * 6) + 2; // 2〜7
                    let baseB = Math.floor(Math.random() * 6) + 2;
                    while (getGCD(baseA, baseB) > 1) { baseB = Math.floor(Math.random() * 6) + 2; } // 互いに素にする
                    
                    let multiplier = Math.floor(Math.random() * 5) + 3; // 3〜7をかけて問題化
                    let qA = baseA * multiplier; let qB = baseB * multiplier;
                    return { text: `${qA} ： ${qB} を最も簡単な比にしましょう。 ＝`, ans: `${baseA} ： ${baseB}` };
                }
                if (level === "2") {
                    // 応用：小数や分数の比を最も簡単な整数の比にする
                    if (Math.random() > 0.5) {
                        // 小数の比 (例: 1.2 : 0.8 -> 12 : 8 -> 3 : 2)
                        let baseA = 3; let baseB = 2; if (Math.random() > 0.5) { baseA = 4; baseB = 3; }
                        let mul = (Math.floor(Math.random() * 3) + 2) / 10; // 0.2〜0.4
                        let qA = (baseA * mul).toFixed(1); let qB = (baseB * mul).toFixed(1);
                        return { text: `${qA} ： ${qB} を最も簡単な比にしましょう。 ＝`, ans: `${baseA} ： ${baseB}` };
                    } else {
                        // 分数の比（横並びテキスト形式表記で「：」と美しく配置）
                        return { text: `1/3 ： 1/4 を最も簡単な比にしましょう。 ＝`, ans: `4 ： 3` };
                    }
                }
                if (level === "3" || level === "4") {
                    // 【再設計：1列レイアウト連動】等しい比の□を求める計算（逆算）
                    let baseA = Math.floor(Math.random() * 4) + 2; // 2〜5
                    let baseB = Math.floor(Math.random() * 4) + 2; 
                    while (getGCD(baseA, baseB) > 1) { baseB = Math.floor(Math.random() * 4) + 2; }
                    
                    let mul = Math.floor(Math.random() * 5) + 3; // 3〜7倍
                    let bigA = baseA * mul; let bigB = baseB * mul;
                    
                    let formula = ""; let targetAns = "";
                    const pattern = Math.floor(Math.random() * 3);
                    
                    if (pattern === 0) {
                        formula = `${baseA} ： ${baseB} ＝ □ ： ${bigB}`;
                        targetAns = String(bigA);
                    } else if (pattern === 1) {
                        formula = `${baseA} ： ${baseB} ＝ ${bigA} ： □`;
                        targetAns = String(bigB);
                    } else {
                        formula = `□ ： ${bigB} ＝ ${baseA} ： ${baseB}`;
                        targetAns = String(bigA);
                    }
                    
                    const qHTML = `<span style="display:inline-flex; justify-content:space-between; align-items:center; width:85%; white-space:nowrap;"><span>${formula}</span><span style="display:inline-block; width:150px; border-bottom:1px solid #000; height:18px; margin-left:15px;"></span></span>`;
                    return { text: qHTML, ans: targetAns, isHTML: true };
                }
            }

            // 4. 文字を使った式
            if (unit === "文字を使った式") {
                // 中学校への架け橋となる、xやyを使った数量関係の立式とxを求める問題
                let xVal = Math.floor(Math.random() * 8) + 5; // xの正体 (5〜12)
                let baseNum = Math.floor(Math.random() * 15) + 10; // 10〜24
                
                if (level === "1" || level === "2") {
                    // 基礎・応用：たし算・ひき算の構造 (例: x + 12 = 20)
                    let total = xVal + baseNum;
                    let formula = Math.random() > 0.5 ? `χ ＋ ${baseNum} ＝ ${total}` : `${total} － χ ＝ ${baseNum}`;
                    return { text: `${formula} のとき、χ にあてはまる数は？ ＝`, ans: String(xVal) };
                } else {
                    // 発展：かけ算・わり算の構造 (例: x × 4 = 32)
                    let multiplier = Math.floor(Math.random() * 4) + 3; // 3〜6
                    let total = xVal * multiplier;
                    let formula = Math.random() > 0.5 ? `χ × ${multiplier} ＝ ${total}` : `${total} ÷ χ ＝ ${multiplier}`;
                    return { text: `${formula} のとき、χ にあてはまる数は？ ＝`, ans: String(xVal) };
                }
            }

            // 5. 分数と小数の混合計算（1列レイアウト専用）
            if (unit === "分数と小数の混合計算") {
                const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
                const f = (w, n, den) => {
                    if (w === 0) return `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                    return `<span class="fraction-whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                };

                let qText, ansStr;

                if (level === "1") {
                    // レベル1: 分数と小数の加減
                    qText = `０.５ ＋ ${f(0, 1, 3)} ＝`;
                    ansStr = f(0, 5, 6);
                } else if (level === "2") {
                    // レベル2: 分数と小数の乗除
                    qText = `０.２５ × ${f(0, 2, 3)} ＝`;
                    ansStr = f(0, 1, 6);
                } else if (level === "3") {
                    // レベル3: 3つの数の混合
                    qText = `０.６ ÷ ${f(0, 2, 5)} × ${f(0, 1, 4)} ＝`;
                    ansStr = f(0, 3, 8);
                } else {
                    // レベル4: 分配法則の工夫
                    qText = `１.４ × ${f(0, 3, 7)} ＋ ０.７ × ${f(0, 3, 7)} ＝`;
                    ansStr = f(0, 9, 10);
                }

                const qHTML = `<span style="display:inline-flex; justify-content:space-between; align-items:center; width:85%; white-space:nowrap;"><span>${qText}</span><span style="display:inline-block; width:150px; border-bottom:1px solid #000; height:18px; margin-left:15px;"></span></span>`;
                return { text: qHTML, ans: ansStr, isHTML: true };
            }

            // 6. 複雑な四則混合計算（1列レイアウト専用）
            if (unit === "複雑な四則混合計算") {
                const f = (w, n, den) => {
                    if (w === 0) return `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                    return `<span class="fraction-whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                };

                let qText, ansStr;

                if (level === "1") {
                    // レベル1: カッコのある3数
                    qText = `（０.５ ＋ ${f(0, 1, 4)}） × ${f(0, 4, 3)} ＝`;
                    ansStr = "1";
                } else if (level === "2") {
                    // レベル2: 4数の四則混合
                    qText = `${f(0, 2, 3)} × １.５ － ${f(0, 1, 4)} ÷ ０.５ ＝`;
                    ansStr = f(0, 1, 2);
                } else if (level === "3") {
                    // レベル3: □を求める逆算
                    qText = `□ × ${f(0, 2, 3)} ＋ ０.５ ＝ １.５`;
                    ansStr = f(1, 1, 2);
                } else {
                    // レベル4: 中学受験最難関（3.14の工夫）
                    qText = `３.１４ × ８ ＋ ３.１４ × ２ ＝`;
                    ansStr = "31.4";
                }

                const qHTML = `<span style="display:inline-flex; justify-content:space-between; align-items:center; width:85%; white-space:nowrap;"><span>${qText}</span><span style="display:inline-block; width:150px; border-bottom:1px solid #000; height:18px; margin-left:15px;"></span></span>`;
                return { text: qHTML, ans: ansStr, isHTML: true };
            }

            // 【新設単元】比例の関係と代入計算
            if (unit === "比例の関係と代入計算") {
                const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
                const f = (w, n, den) => {
                    if (w === 0) return `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                    return `<span class="fraction-whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                };
                
                if (level === "1") {
                    // 基礎：y ＝ 決まった数 × x への整数の代入
                    let k = Math.floor(Math.random() * 5) + 2; 
                    let x = Math.floor(Math.random() * 8) + 2; 
                    return { text: `y ＝ ${k} × x  ［ x ＝ ${x} のときの y ］`, ans: String(k * x) };
                }
                if (level === "2") {
                    // 応用：y ＝ 決まった数 × x への小数の代入
                    let k = Math.floor(Math.random() * 3) + 2; 
                    const xDecimals = [1.2, 1.5, 2.5, 0.5, 0.8];
                    let x = xDecimals[Math.floor(Math.random() * xDecimals.length)];
                    let ansVal = parseFloat((k * x).toFixed(1));
                    return { text: `y ＝ ${k} × x  ［ x ＝ ${x.toFixed(1)} のときの y ］`, ans: String(ansVal) };
                }
                if (level === "3") {
                    // 発展：y ＝ 決まった数 × x への分数の代入
                    let k = Math.floor(Math.random() * 3) + 2; 
                    let den = Math.random() > 0.5 ? 3 : 5;
                    let num = Math.floor(Math.random() * (den - 1)) + 1; 
                    
                    let ansNum = k * num; let ansDen = den;
                    const gcd = getGCD(ansNum, ansDen);
                    ansNum /= gcd; ansDen /= gcd;
                    
                    let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : f(Math.floor(ansNum / ansDen), ansNum % ansDen, ansDen);
                    return { text: `y ＝ ${k} × x  ［ x ＝ ${f(0, num, den)} のときの y ］`, ans: ansStr, isHTML: true };
                }
                if (level === "4") {
                    // 最高峰：【1列化】反比例 y ＝ 決まった数 ÷ x への代入計算
                    const kList = [12, 18, 24, 36];
                    let k = kList[Math.floor(Math.random() * kList.length)];
                    
                    let validX = [];
                    for(let i = 2; i <= 12; i++) {
                        if (k % i === 0) validX.push(i);
                    }
                    let x = validX[Math.floor(Math.random() * validX.length)];
                    let ansVal = k / x;

                    const qHTML = `<span style="display:inline-flex; justify-content:space-between; align-items:center; width:90%; white-space:nowrap;"><span>y ＝ ${k} ÷ x  ［ x ＝ ${x} のときの y ］</span><span style="display:inline-block; width:150px; border-bottom:1px solid #000; height:18px; margin-left:15px;"></span></span>`;
                    return { text: qHTML, ans: String(ansVal), isHTML: true };
                }
            }


            return { text: `[${unit}・Lv${level}] 📝問 ＝`, ans: "解答" };
        }

        function generateAndPrint() {
            const grade = document.getElementById("grade-select").value;
            const level = document.getElementById("level-select").value;
            const totalQuestions = parseInt(document.getElementById("question-count-select").value);
            const pageCount = parseInt(document.getElementById("page-count").value);
            const checkedBoxes = document.querySelectorAll('input[name="unit-choice"]:checked');
            const selectedUnits = Array.from(checkedBoxes).map(cb => cb.value);
            
            if (selectedUnits.length === 0) { alert("単元を最低1つ以上選択してください。"); return; }
            
            const previewArea = document.getElementById('preview-area');
            previewArea.innerHTML = ''; 

            // 長文単元の判定（既存の制限単元に、新設された4つの長文・特殊レイアウト単元を完全統合）
            const isLongFormulaUnit = 
                (selectedUnits.some(u => u.includes("四則混合")) && level === "4") || 
                selectedUnits.some(u => u.includes("見積もり")) ||
                selectedUnits.some(u => u.includes("公倍数・公約数")) ||
                (selectedUnits.some(u => u.includes("分数のわり算")) && level === "4") ||
                (selectedUnits.some(u => u.includes("比の計算")) && (level === "3" || level === "4")) ||
                selectedUnits.some(u => u.includes("混合計算")) ||
                selectedUnits.some(u => u.includes("複雑な四則混合")) ||
                selectedUnits.some(u => u.includes("あまりのあるわり算のたしかめ")) || // 3年新設
                (selectedUnits.some(u => u.includes("小数の乗除筆算")) && level === "4") || // 4年新設Lv4
                selectedUnits.some(u => u.includes("単位の換算と計算")) || // 5年新設
                (selectedUnits.some(u => u.includes("比例の関係と代入計算")) && level === "4"); // 6年新設Lv4

            
            let gridColumns = "1fr 1fr"; 
            let gridGapY = 55;   
            let qItemHeight = 65; 
            
            // 縦1列のとき、ヘッダー周りの余白（通常35px）を縮めるための変数
            let headerTableStyle = "margin-bottom: 35px;";
            let qItemStyle = ""; // 通常は空

            let finalTotalQuestions = totalQuestions;

            if (isLongFormulaUnit) {
                gridColumns = "1fr";
                gridGapY = 40;       // 44 から 40 に微調整（これで下部が数センチ浮き上がります）
                qItemHeight = 48;    // 52 から 48 に微調整
                finalTotalQuestions = 10; 
                headerTableStyle = "margin-bottom: 25px;"; 
                qItemStyle = "white-space: normal; line-height: 1.4; padding-right: 20px;"; 
            } else {
                if (finalTotalQuestions > 10) { gridGapY = 45; qItemHeight = 60; }
                if (finalTotalQuestions > 14) { gridGapY = 35; qItemHeight = 55; }
                if (finalTotalQuestions > 16) { gridGapY = 25; qItemHeight = 55; }
            }

            let scoreText = "得点：　　　/ 100点";
            if (finalTotalQuestions === 10) scoreText = "得点：　　　/ 100点<br><small style='font-size:10px;'>（1問10点）</small>"; // 元の「得0点」のタイポと思われる箇所を「得点：」に補正
            if (finalTotalQuestions === 20) scoreText = "得点：　　　/ 100点<br><small style='font-size:10px;'>（1問5点）</small>";
            
            let allPagesAnswers = [];

            for (let p = 1; p <= pageCount; p++) {
                const page = document.createElement('div'); page.className = 'print-page';
                const titleUnitText = selectedUnits.length > 2 ? "計算総合ミックス" : selectedUnits.join('・');
                
                // header-table に動的スタイルを適用
                let html = `
                    <div class="title" style="${isLongFormulaUnit ? 'margin-bottom:10px;' : ''}">${grade}年生の算数プリント（第 ${p} 回）</div>
                    <div style="text-align:center; font-size:14px; margin-top:-15px; margin-bottom:15px;">【単元】${titleUnitText} ／ 【難易度】レベル${level}</div>
                    <table class="header-table" style="${headerTableStyle}"><tr><td style="width: 50%;">組・氏名：</td><td style="width: 25%;">日付：　　月　　日</td><td style="width: 25%; line-height:1.2;">${scoreText}</td></tr></table>
                    <div class="question-list" style="gap: ${gridGapY}px 15px; grid-template-columns: ${gridColumns};">
                `;
                
                let currentPageAnswers = [];
                let usedQuestions = new Set();

                for (let q = 1; q <= finalTotalQuestions; q++) {
                    let qObj; let retryCount = 0;
                    do {
                        const randomUnit = selectedUnits[Math.floor(Math.random() * selectedUnits.length)];
                        qObj = createSingleQuestion(grade, randomUnit, level);
                        retryCount++;
                    } while (usedQuestions.has(qObj.text) && retryCount < 30);

                    usedQuestions.add(qObj.text);
                    // qItemStyle をインラインで適用し、長文時の改行と余白を制御
                    html += `<div class="q-item" style="height:${qItemHeight}px; ${qItemStyle}">（${q}） ${qObj.text}</div>`;
                    currentPageAnswers.push(qObj.ans); 
                }
                html += `</div>`; page.innerHTML = html; previewArea.appendChild(page);
                allPagesAnswers.push(currentPageAnswers);
            }

            for (let p = 1; p <= pageCount; p++) {
                const ansPage = document.createElement('div'); ansPage.className = 'print-page ans-page'; 
                let html = `
                    <div class="ans-title" style="${isLongFormulaUnit ? 'margin-bottom:10px;' : ''}">⭕ まるつけよう解答（第 ${p} 回）</div>
                    <div style="text-align:center; font-size:14px; margin-top:-20px; margin-bottom:25px; color:#cc0000;">※ていねいにまるつけをしましょう。</div>
                    <div class="question-list ans-item" style="gap: ${gridGapY}px 15px; grid-template-columns: ${gridColumns};">
                `;
                for (let q = 1; q <= finalTotalQuestions; q++) {
                    // 解答ページも同様に改行スタイルを適用
                    html += `<div class="q-item" style="height:${qItemHeight}px; ${qItemStyle}">（${q}） 答： ${allPagesAnswers[p-1][q-1]}</div>`;
                }
                html += `</div>`; ansPage.innerHTML = html; previewArea.appendChild(ansPage);
            }
            setTimeout(() => { window.print(); }, 300);
        }


        function validateQuestionCount() {
            const level = document.getElementById("level-select").value;
            const qCountSelect = document.getElementById("question-count-select");
            const checkedBoxes = document.querySelectorAll('input[name="unit-choice"]:checked');
            const selectedUnits = Array.from(checkedBoxes).map(cb => cb.value);

            // 【修正】4年生の四則混合Lv4、見積もり全Lvに加え、5年生の「公倍数・公約数の暗算」も常に10問（1列レイアウト）制限の対象にします
            // 【修正】6年生のわり算Lv4、比の計算Lv3・4も自動的に10問（1列レイアウト）制限の対象にします
            // 【新設統合】新たに追加された3〜6年生の長文・特殊レイアウト単元も自動的に10問制限の対象に統合します
            const isRestricted = 
                (selectedUnits.some(u => u.includes("四則混合")) && level === "4") || 
                selectedUnits.some(u => u.includes("見積もり")) ||
                selectedUnits.some(u => u.includes("公倍数・公約数")) ||
                (selectedUnits.some(u => u.includes("分数のわり算")) && level === "4") ||
                (selectedUnits.some(u => u.includes("比の計算")) && (level === "3" || level === "4")) ||
                selectedUnits.some(u => u.includes("混合計算")) ||
                selectedUnits.some(u => u.includes("複雑な四則混合")) ||
                selectedUnits.some(u => u.includes("あまりのあるわり算のたしかめ")) || // 3年新設
                (selectedUnits.some(u => u.includes("小数の乗除筆算")) && level === "4") || // 4年新設Lv4
                selectedUnits.some(u => u.includes("単位の換算と計算")) || // 5年新設
                (selectedUnits.some(u => u.includes("比例の関係と代入計算")) && level === "4"); // 6年新設Lv4

            Array.from(qCountSelect.options).forEach(option => {
                const val = parseInt(option.value);
                if (isRestricted && val > 10) {
                    option.style.display = "none";
                    option.disabled = true;
                } else {
                    option.style.display = "block";
                    option.disabled = false;
                }
            });

            if (isRestricted && parseInt(qCountSelect.value) > 10) {
                qCountSelect.value = "10";
            }
        }



        window.onload = updateUnits;
    </script>
</body>
</html>
