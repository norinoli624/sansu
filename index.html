						// 同じ数字が多くなるのを防ぐ防壁ロジック
						if (w1 !== w2 && d1 !== d2 && n1 !== n2) break;
					}
					let improperNum1 = w1 * d1 + n1;
					let improperNum2 = w2 * d2 + n2;
					let ansNum = improperNum1 * improperNum2;
					let ansDen = d1 * d2;
					const gcd = getGCD(ansNum, ansDen);
					ansNum /= gcd; ansDen /= gcd;
					let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : f(Math.floor(ansNum / ansDen), ansNum % ansDen, ansDen);
					return { text: `${f(w1, n1, d1)} × ${f(w2, n2, d2)} ＝`, ans: ansStr, isHTML: true };
				}
				if (level === "4") {
					let type = Math.floor(Math.random() * 3);
					if (type === 0) {
						const decs = [{v: 0.2, n: 1, d: 5}, {v: 0.4, n: 2, d: 5}, {v: 0.5, n: 1, d: 2}, {v: 0.6, n: 3, d: 5}, {v: 0.8, n: 4, d: 5}, {v: 0.25, n: 1, d: 4}, {v: 0.75, n: 3, d: 4}];
						let dec = decs[Math.floor(Math.random() * decs.length)];
						let fd = Math.floor(Math.random() * 5) + 2;
						let fn = Math.floor(Math.random() * (fd - 1)) + 1;
						let ansNum = dec.n * fn; let ansDen = dec.d * fd;
						const gcd = getGCD(ansNum, ansDen); ansNum /= gcd; ansDen /= gcd;
						let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : f(0, ansNum, ansDen);
						return { text: `${dec.v} × ${f(0, fn, fd)} ＝`, ans: ansStr, isHTML: true };
					} else if (type === 1) {
						const decs = [{v: 0.2, n: 1, d: 5}, {v: 0.4, n: 2, d: 5}, {v: 0.5, n: 1, d: 2}, {v: 0.6, n: 3, d: 5}, {v: 0.8, n: 4, d: 5}, {v: 0.25, n: 1, d: 4}, {v: 0.75, n: 3, d: 4}];
						let dec = decs[Math.floor(Math.random() * decs.length)];
						let fd = Math.floor(Math.random() * 5) + 2;
						let fn = Math.floor(Math.random() * (fd - 1)) + 1;
						let ansNum = fn * dec.n; let ansDen = fd * dec.d;
						const gcd = getGCD(ansNum, ansDen); ansNum /= gcd; ansDen /= gcd;
						let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : f(0, ansNum, ansDen);
						return { text: `${f(0, fn, fd)} × ${dec.v} ＝`, ans: ansStr, isHTML: true };
					} else {
						let d1 = 2, d2 = 3, d3 = 4;
						let n1 = 1, n2 = Math.floor(Math.random() * 2) + 1, n3 = Math.floor(Math.random() * 3) + 1;
						if (Math.random() > 0.5) { d1 = 3; d2 = 5; d3 = 2; n2 = Math.floor(Math.random() * 4) + 1; }
						let ansNum = n1 * n2 * n3; let ansDen = d1 * d2 * d3;
						const gcd = getGCD(ansNum, ansDen); ansNum /= gcd; ansDen /= gcd;
						let ansStr = f(0, ansNum, ansDen);
						return { text: `${f(0, n1, d1)} × ${f(0, n2, d2)} × ${f(0, n3, d3)} ＝`, ans: ansStr, isHTML: true };
					}
				}
			}            
            
            // 2. 分数のわり算
			if (unit === "分数のわり算") {
				const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
				const f = (w, n, den) => {
					if (w === 0) return `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
					return `<span class="fraction-whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
				};
				if (level === "1") {
					let d = Math.floor(Math.random() * 8) + 2;
					let n = Math.floor(Math.random() * (d - 1)) + 1;
					let c = Math.floor(Math.random() * 8) + 2;
					let ansNum = n; let ansDen = d * c;
					const gcd = getGCD(ansNum, ansDen); ansNum /= gcd; ansDen /= gcd;
					return { text: `${f(0, n, d)} ÷ ${c} ＝`, ans: f(0, ansNum, ansDen), isHTML: true };
				}
				if (level === "2") {
					let d1 = Math.floor(Math.random() * 8) + 2; let d2 = Math.floor(Math.random() * 8) + 2;
					let n1 = Math.floor(Math.random() * (d1 - 1)) + 1; let n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
					let ansNum = n1 * d2; let ansDen = d1 * n2;
					const gcd = getGCD(ansNum, ansDen); ansNum /= gcd; ansDen /= gcd;
					let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : (ansNum > ansDen) ? f(Math.floor(ansNum / ansDen), ansNum % ansDen, ansDen) : f(0, ansNum, ansDen);
					return { text: `${f(0, n1, d1)} ÷ ${f(0, n2, d2)} ＝`, ans: ansStr, isHTML: true };
				}
				if (level === "3") {
					// 【修正】分母の数字が5以下になるのを防ぎ、6〜12の大きな分母をランダム強制生成
					let d1, d2, n1, n2;
					while(true) {
						d1 = Math.floor(Math.random() * 7) + 6; // 6〜12の分母
						d2 = Math.floor(Math.random() * 7) + 6; // 6〜12の分母
						n1 = Math.floor(Math.random() * (d1 - 1)) + 1;
						n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
						if (d1 !== d2 && getGCD(n1, d1) === 1 && getGCD(n2, d2) === 1) break;
					}
					let ansNum = n1 * d2; let ansDen = d1 * n2;
					const gcd = getGCD(ansNum, ansDen); ansNum /= gcd; ansDen /= gcd;
					let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : (ansNum > ansDen) ? f(Math.floor(ansNum / ansDen), ansNum % ansDen, ansDen) : f(0, ansNum, ansDen);
					return { text: `${f(0, n1, d1)} ÷ ${f(0, n2, d2)} ＝`, ans: ansStr, isHTML: true };
				}
				if (level === "4") {
					let d1 = Math.floor(Math.random() * 5) + 2; let d2 = Math.floor(Math.random() * 5) + 2;
					let n1 = Math.floor(Math.random() * (d1 - 1)) + 1; let n2 = Math.floor(Math.random() * (d2 - 1)) + 1;
					let c = Math.floor(Math.random() * 4) + 2;
					let ansNum = n1 * d2; let ansDen = d1 * n2 * c;
					const gcd = getGCD(ansNum, ansDen); ansNum /= gcd; ansDen /= gcd;
					return { text: `${f(0, n1, d1)} ÷ ${f(0, n2, d2)} ÷ ${c} ＝`, ans: f(0, ansNum, ansDen), isHTML: true };
				}
			}

            // 3. 比の計算
            if (unit === "比の計算") {
                const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
                
                if (level === "1") {
                    // 基礎：比を最も簡単な整数の比にする（2数の公約数で割る）
                    let baseA = Math.floor(Math.random() * 6) + 2; // 2〜7
                    let baseB = Math.floor(Math.random() * 6) + 2;
                    while (getGCD(baseA, baseB) > 1) { baseB = Math.floor(Math.random() * 6) + 2; } // 互いに素にする
                    
                    let multiplier = Math.floor(Math.random() * 5) + 3; // 3〜7をかけて問題化
                    let qA = baseA * multiplier; let qB = baseB * multiplier;
                    return { text: `${qA} ： ${qB} を最も簡単な比にしましょう。 ＝`, ans: `${baseA} ： ${baseB}` };
                }
                if (level === "2") {
                    // 応用：小数や分数の比を最も簡単な整数の比にする
                    if (Math.random() > 0.5) {
                        // 小数の比 (例: 1.2 : 0.8 -> 12 : 8 -> 3 : 2)
                        let baseA = 3; let baseB = 2; if (Math.random() > 0.5) { baseA = 4; baseB = 3; }
                        let mul = (Math.floor(Math.random() * 3) + 2) / 10; // 0.2〜0.4
                        let qA = (baseA * mul).toFixed(1); let qB = (baseB * mul).toFixed(1);
                        return { text: `${qA} ： ${qB} を最も簡単な比にしましょう。 ＝`, ans: `${baseA} ： ${baseB}` };
                    } else {
                        // 分数の比（横並びテキスト形式表記で「：」と美しく配置）
                        return { text: `1/3 ： 1/4 を最も簡単な比にしましょう。 ＝`, ans: `4 ： 3` };
                    }
                }
                if (level === "3" || level === "4") {
                    // 【再設計：1列レイアウト連動】等しい比の□を求める計算（逆算）
                    let baseA = Math.floor(Math.random() * 4) + 2; 
                    let baseB = Math.floor(Math.random() * 4) + 2; 
                    while (getGCD(baseA, baseB) > 1) { baseB = Math.floor(Math.random() * 4) + 2; }
                
                    let mul = Math.floor(Math.random() * 5) + 3; 
                    let bigA = baseA * mul; let bigB = baseB * mul;
                
                    let formula = ""; let targetAns = "";
                    const pattern = Math.floor(Math.random() * 3);
                
                    if (pattern === 0) {
                        formula = `${baseA} ： ${baseB} ＝ □ ： ${bigB}`;
                        targetAns = String(bigA);
                    } else if (pattern === 1) {
                        formula = `${baseA} ： ${baseB} ＝ ${bigA} ： □`;
                        targetAns = String(bigB);
                    } else {
                        formula = `□ ： ${bigB} ＝ ${baseA} ： ${baseB}`;
                        targetAns = String(bigA);
                    }
                
                    const qHTML = `<span style="display:inline-flex; justify-content:space-between; align-items:center; width:85%; white-space:nowrap;"><span>${formula}</span><span style="display:inline-block; width:150px; border-bottom:1px solid #000; height:18px; margin-left:15px;"></span></span>`;
                    // 【修正】isWide: true を追記
                    return { text: qHTML, ans: targetAns, isHTML: true, isWide: true };
                }
            }

            // 4. 文字を使った式
            if (unit === "文字を使った式") {
                // 中学校への架け橋となる、xやyを使った数量関係の立式とxを求める問題
                let xVal = Math.floor(Math.random() * 8) + 5; // xの正体 (5〜12)
                let baseNum = Math.floor(Math.random() * 15) + 10; // 10〜24
                
                if (level === "1" || level === "2") {
                    // 基礎・応用：たし算・ひき算の構造 (例: x + 12 = 20)
                    let total = xVal + baseNum;
                    let formula = Math.random() > 0.5 ? `χ ＋ ${baseNum} ＝ ${total}` : `${total} － χ ＝ ${baseNum}`;
                    return { text: `${formula} のとき、χ にあてはまる数は？ ＝`, ans: String(xVal) };
                } else {
                    // 発展：かけ算・わり算の構造 (例: x × 4 = 32)
                    let multiplier = Math.floor(Math.random() * 4) + 3; // 3〜6
                    let total = xVal * multiplier;
                    let formula = Math.random() > 0.5 ? `χ × ${multiplier} ＝ ${total}` : `${total} ÷ χ ＝ ${multiplier}`;
                    return { text: `${formula} のとき、χ にあてはまる数は？ ＝`, ans: String(xVal) };
                }
            }

            // 5. 分数と小数の混合計算（1列レイアウト専用）
            if (unit === "分数と小数の混合計算") {
                const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
                const f = (w, n, den) => {
                    if (w === 0) return `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                    return `<span class="fraction-whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                };

                if (level === "1") {
                    // レベル1：【1列化】分数と小数の加減計算・基本
                    let den = Math.floor(Math.random() * 4) + 3; // 3〜6
                    let num = Math.floor(Math.random() * (den - 1)) + 1;
                    while (getGCD(num, den) > 1) { num = Math.floor(Math.random() * (den - 1)) + 1; }
                    
                    const decChoices = [{v: 0.2, n: 1, d: 5}, {v: 0.4, n: 2, d: 5}, {v: 0.5, n: 1, d: 2}, {v: 0.25, n: 1, d: 4}];
                    let dec = decChoices[Math.floor(Math.random() * decChoices.length)];

                    let ansNum = num * dec.d + dec.n * den;
                    let ansDen = den * dec.d;
                    let gcd = getGCD(ansNum, ansDen);
                    ansNum /= gcd; ansDen /= gcd;
                    let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : (ansNum > ansDen) ? f(Math.floor(ansNum / ansDen), ansNum % ansDen, ansDen) : f(0, ansNum, ansDen);

                    return { text: `${f(0, num, den)} ＋ ${dec.v} ＝`, ans: ansStr, isHTML: true, isWide: true };
                }

                if (level === "2") {
                    // レベル2：【1列化】分数と小数の乗除計算・基本
                    let den = Math.floor(Math.random() * 5) + 3; // 3〜7
                    let num = Math.floor(Math.random() * (den - 1)) + 1;
                    while (getGCD(num, den) > 1) { num = Math.floor(Math.random() * (den - 1)) + 1; }
                    
                    const decChoices = [{v: 0.5, n: 1, d: 2}, {v: 0.25, n: 1, d: 4}, {v: 0.6, n: 3, d: 5}];
                    let dec = decChoices[Math.floor(Math.random() * decChoices.length)];

                    // 式：分数 ÷ 小数 ➔ 分子×小数の分母 / 分母×小数の分子
                    let ansNum = num * dec.d;
                    let ansDen = den * dec.n;
                    let gcd = getGCD(ansNum, ansDen);
                    ansNum /= gcd; ansDen /= gcd;
                    let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : (ansNum > ansDen) ? f(Math.floor(ansNum / ansDen), ansNum % ansDen, ansDen) : f(0, ansNum, ansDen);

                    return { text: `${f(0, num, den)} ÷ ${dec.v} ＝`, ans: ansStr, isHTML: true, isWide: true };
                }

                if (level === "3") {
                    // レベル3：【1列化】分数・小数3つの加減乗除混合
                    // 式：分数 × 小数 ＋ 分数
                    let den1 = 3, den2 = 4;
                    let num1 = 1, num2 = 1; 
                    let dec = 0.5; // 1/2
                    
                    // 1/3 * 1/2 + 1/4 = 1/6 + 1/4 = 2/12 + 3/12 = 5/12
                    let ansStr = f(0, 5, 12);
                    if (Math.random() > 0.5) {
                        den1 = 5; num1 = 2; dec = 0.2; den2 = 2; num2 = 1;
                        // 2/5 * 1/5 + 1/2 = 2/25 + 1/2 = 4/50 + 25/50 = 29/50
                        ansStr = f(0, 29, 50);
                    }
                    return { text: `${f(0, num1, den1)} × ${dec} ＋ ${f(0, num2, den2)} ＝`, ans: ansStr, isHTML: true, isWide: true };
                }

                if (level === "4") {
                    // レベル4：【1列化】最高峰：計算の工夫・分配法則
                    // 式：分数 × 小数 ＋ 分数 × 工夫小数 (小数＋工夫小数＝1になるように美しい逆算配置)
                    let den = Math.floor(Math.random() * 4) + 3; // 3〜6
                    let num = Math.floor(Math.random() * (den - 1)) + 1;
                    while (getGCD(num, den) > 1) { num = Math.floor(Math.random() * (den - 1)) + 1; }
                    
                    const pairs = [{v1: 0.75, v2: 0.25}, {v1: 0.6, v2: 0.4}, {v1: 0.8, v2: 0.2}];
                    let pair = pairs[Math.floor(Math.random() * pairs.length)];

                    // 分配法則により、共通因数の「分数 × (pair.v1 + pair.v2)」となり、カッコ内が1になるため、答えは「分数」そのものになる美構造
                    let ansStr = f(0, num, den);
                    
                    return { text: `${f(0, num, den)} × ${pair.v1} ＋ ${f(0, num, den)} × ${pair.v2} ＝`, ans: ansStr, isHTML: true, isWide: true };
                }
            }

            // ==========================================
            // 複雑な四則混合計算（小6）レベル4 拡張版
            // ==========================================
            if (unit === "複雑な四則混合計算") {
                const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
                const f = (w, n, den) => {
                    if (w === 0) return `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                    return `<span class="fraction-whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                };

                if (level === "1") {
                    // レベル1：【1列化】基礎：カッコのある分数・小数の3数混合
                    // 式：( 分数 ＋ 小数 ) × 整数
                    let den = Math.floor(Math.random() * 4) + 3; // 3〜6
                    let num = Math.floor(Math.random() * (den - 1)) + 1;
                    while (getGCD(num, den) > 1) { num = Math.floor(Math.random() * (den - 1)) + 1; }
                    
                    const decChoices = [{v: 0.5, n: 1, d: 2}, {v: 0.25, n: 1, d: 4}, {v: 0.2, n: 1, d: 5}];
                    let dec = decChoices[Math.floor(Math.random() * decChoices.length)];
                    let c = Math.floor(Math.random() * 3) + 2; // 2〜4

                    // 逆算ロジック
                    let innerNum = num * dec.d + dec.n * den;
                    let innerDen = den * dec.d;
                    let finalNum = innerNum * c;
                    let finalDen = innerDen;
                    
                    let gcd = getGCD(finalNum, finalDen);
                    finalNum /= gcd; finalDen /= gcd;
                    let ansStr = (finalNum % finalDen === 0) ? `${finalNum / finalDen}` : (finalNum > finalDen) ? f(Math.floor(finalNum / finalDen), finalNum % finalDen, finalDen) : f(0, finalNum, finalDen);
                    
                    return { text: `（ ${f(0, num, den)} ＋ ${dec.v} ） × ${c} ＝`, ans: ansStr, isHTML: true, isWide: true };
                }

                if (level === "2") {
                    // レベル2：【1列化】応用：分数・小数の4数四則混合計算
                    // 式：分数 × 整数 ＋ 小数 ÷ 分数
                    let den1 = 3, den2 = 2;
                    let num1 = 1, num2 = 1; // 1/3, 1/2
                    let b = 2; // 整数
                    let dec = 0.5; // 1/2
                    
                    // (1/3 * 2) + (1/2 / 1/2) = 2/3 + 1 = 1と2/3
                    let ansStr = f(1, 2, 3);
                    // バリエーション用のシャッフル
                    if (Math.random() > 0.5) {
                        den1 = 4; num1 = 1; b = 3; dec = 0.25; den2 = 3; num2 = 1;
                        // (1/4 * 3) + (1/4 / 1/3) = 3/4 + 3/4 = 6/4 = 1と1/2
                        ansStr = f(1, 1, 2);
                    }
                    return { text: `${f(0, num1, den1)} × ${b} ＋ ${dec} ÷ ${f(0, num2, den2)} ＝`, ans: ansStr, isHTML: true, isWide: true };
                }

                if (level === "3") {
                    // レベル3：【1列化】発展：逆算・□を求める文字式混合
                    // 式：□ ＋ 分数 × 整数 ＝ 小数（逆算して破綻しないよう制御）
                    let b = Math.floor(Math.random() * 2) + 2; // 2〜3
                    let den = b * (Math.floor(Math.random() * 2) + 2); // 分母をbの倍数にして綺麗に落とす
                    let num = Math.floor(Math.random() * (den - 1)) + 1;
                    while (getGCD(num, den) > 1) { num = Math.floor(Math.random() * (den - 1)) + 1; }
                    
                    // 分数 * 整数 の部分を計算
                    let mulNum = num * b;
                    let mulDen = den;
                    let mulGcd = getGCD(mulNum, mulDen);
                    mulNum /= mulGcd; mulDen /= mulGcd;

                    // 答えがマイルドな小数（整数＋0.5など）になるようターゲットを逆算設定
                    let targetDec = (Math.floor(Math.random() * 3) + 3) + 0.5; // 3.5, 4.5, 5.5
                    let decNum = targetDec * 2;
                    let decDen = 2;

                    // □ ＝ 小数 － (分数×整数)
                    let boxNum = decNum * mulDen - mulNum * decDen;
                    let boxDen = decDen * mulDen;
                    let boxGcd = getGCD(boxNum, boxDen);
                    boxNum /= boxGcd; boxDen /= boxGcd;
                    
                    let ansStr = (boxNum % boxDen === 0) ? `${boxNum / boxDen}` : (boxNum > boxDen) ? f(Math.floor(boxNum / boxDen), boxNum % boxDen, boxDen) : f(0, boxNum, boxDen);
                    
                    return { text: `□ ＋ ${f(0, num, den)} × ${b} ＝ ${targetDec}`, ans: ansStr, isHTML: true, isWide: true };
                }

                if (level === "4") {
                    // レベル4：【1列化】最高峰：中学受験・最難関レベル混合
                    let d1 = Math.floor(Math.random() * 11) + 10; 
                    let d2 = Math.floor(Math.random() * 6) + 4;   
                    while (d1 === d2 || getGCD(d1, d2) > 2) { d2 = Math.floor(Math.random() * 6) + 4; }

                    let n1 = Math.floor(Math.random() * (d1 - 3)) + 2; 
                    let n2 = Math.floor(Math.random() * (d2 - 2)) + 2; 
                    let w1 = Math.floor(Math.random() * 2) + 1; 
                    let w2 = Math.floor(Math.random() * 2) + 1; 

                    const decChoices = [
                        {v: 0.2, n: 1, d: 5}, {v: 0.4, n: 2, d: 5}, {v: 0.6, n: 3, d: 5}, {v: 0.8, n: 4, d: 5},
                        {v: 0.25, n: 1, d: 4}, {v: 0.75, n: 3, d: 4}, {v: 0.5, n: 1, d: 2},
                        {v: 0.125, n: 1, d: 8}, {v: 0.375, n: 3, d: 8}
                    ];
                    let decObj = decChoices[Math.floor(Math.random() * decChoices.length)];

                    let improperN1 = w1 * d1 + n1;
                    let improperN2 = w2 * d2 + n2;
                    let lcm = (d1 * d2) / getGCD(d1, d2);
                    let v1 = improperN1 * (lcm / d1);
                    let v2 = improperN2 * (lcm / d2);
                    
                    if (v1 <= v2) {
                        let temp = improperN1; improperN1 = improperN2; improperN2 = temp;
                        let tempD = d1; d1 = d2; d2 = tempD;
                        let tempN = n1; n1 = n2; n2 = tempN;
                        let tempW = w1; w1 = w2; w2 = tempW;
                    }

                    let diffNum = (improperN1 * (lcm / d1)) - (improperN2 * (lcm / d2));
                    let finalNum = diffNum * decObj.n;
                    let finalDen = lcm * decObj.d;

                    let finalGCD = getGCD(finalNum, finalDen);
                    finalNum /= finalGCD; finalDen /= finalGCD;

                    let ansStr = (finalNum % finalDen === 0) ? `${finalNum / finalDen}` : (finalNum > finalDen) ? f(Math.floor(finalNum / finalDen), finalNum % finalDen, finalDen) : f(0, finalNum, finalDen);
                    return { text: `（ ${f(w1, n1, d1)} － ${f(w2, n2, d2)} ） × ${decObj.v} ＝`, ans: ansStr, isHTML: true, isWide: true };
                }
            }

            // ==========================================
            // 【修正版】比例の関係と代入計算（小6）全レベル1列化対応
            // ==========================================
            if (unit === "比例の関係と代入計算") {
                const f = (w, n, den) => {
                    if (w === 0) return `<span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                    return `<span class="fraction-whole">${w}</span><span class="fraction"><span class="numerator">${n}</span><span class="denominator">${den}</span></span>`;
                };

                if (level === "1") {
                    // レベル1：y = 決まった数 × x への整数の代入
                    let k = Math.floor(Math.random() * 8) + 2; // 決まった数 (2〜9)
                    let x = Math.floor(Math.random() * 8) + 2; // x (2〜9)
                    // 【修正】isWide: true を追記して1列化
                    return { text: `ｙ ＝ ${k} × ｘ で、ｘ ＝ ${x} のとき、ｙ ＝`, ans: String(k * x), isWide: true };
                }
                
                if (level === "2") {
                    // レベル2：y = 決まった数 × x への小数の代入
                    let k = Math.floor(Math.random() * 8) + 2; // 決まった数 (2〜9)
                    let x = (Math.floor(Math.random() * 9) + 1) / 10; // x (0.1〜0.9)
                    let ansVal = parseFloat((k * x).toFixed(1));
                    // 【修正】isWide: true を追記して1列化
                    return { text: `ｙ ＝ ${k} × ｘ で、ｘ ＝ ${x.toFixed(1)} のとき、ｙ ＝`, ans: String(ansVal), isWide: true };
                }
                
                if (level === "3") {
                    // レベル3：y = 決まった数 × x への分数の代入
                    let k = Math.floor(Math.random() * 5) + 2; // 決まった数 (2〜6)
                    let den = Math.floor(Math.random() * 5) + 3; // 分母 (3〜7)
                    let num = Math.floor(Math.random() * (den - 1)) + 1; // 分子
                    
                    // 分数の掛け算ロジックと約分処理
                    let ansNum = k * num;
                    let ansDen = den;
                    const getGCD = (x, y) => (y === 0 ? x : getGCD(y, x % y));
                    let gcd = getGCD(ansNum, ansDen);
                    ansNum /= gcd; ansDen /= gcd;
                    
                    let ansStr = (ansNum % ansDen === 0) ? `${ansNum / ansDen}` : (ansNum > ansDen) ? f(Math.floor(ansNum / ansDen), ansNum % ansDen, ansDen) : f(0, ansNum, ansDen);
                    // 【修正】isWide: true を追記して1列化
                    return { text: `ｙ ＝ ${k} × ｘ で、ｘ ＝ ${f(0, num, den)} のとき、ｙ ＝`, ans: ansStr, isHTML: true, isWide: true };
                }
                
                if (level === "4") {
                    // レベル4：【1列化】反比例 y = 決まった数 ÷ x への代入計算
                    let x = Math.floor(Math.random() * 6) + 2; // x (2〜7)
                    let ansVal = Math.floor(Math.random() * 5) + 2; // yの答え (2〜6)
                    let k = x * ansVal; // 決まった数（比例定数）
                    return { text: `ｙ ＝ ${k} ÷ ｘ で、ｘ ＝ ${x} のとき、ｙ ＝`, ans: String(ansVal), isWide: true };
                }
            }
            return { text: `[${unit}・Lv${level}] 📝問 ＝`, ans: "解答" };
        }

        function generateAndPrint() {
            const grade = document.getElementById("grade-select").value;
            const level = document.getElementById("level-select").value;
            const qCountSelect = document.getElementById("question-count-select");
            const qCount = parseInt(qCountSelect.value);
            const pageCount = parseInt(document.getElementById("page-count").value) || 1;
            
            // チェックされている単元のリストを取得
            const checkedBoxes = document.querySelectorAll('input[name="unit-choice"]:checked');
            const selectedUnits = Array.from(checkedBoxes).map(cb => cb.value);
            
            if (selectedUnits.length === 0) {
                alert("少なくとも1つの単元を選択してください。");
                return;
            }
            
            const previewArea = document.getElementById("preview-area");
            previewArea.innerHTML = ""; // プレビューエリアを初期化
            
            // 指定されたページ数分、問題ページと解答ページをループ生成
            for (let p = 1; p <= pageCount; p++) {
                // 1. 問題ページの生成
                const qPage = document.createElement("div");
                qPage.className = "print-page";
                
                // ヘッダー（タイトル・名前欄）の構築
                let gradeText = document.getElementById("grade-select").options[document.getElementById("grade-select").selectedIndex].text;
                let levelText = document.getElementById("level-select").options[document.getElementById("level-select").selectedIndex].text;
                
                // レベル表記から詳細な文言を除き、すっきりさせる調整
                if (levelText.includes("（")) {
                    levelText = levelText.substring(0, levelText.indexOf("（"));
                }
                
                // 【修正】選択された単元名を動的に取得して表示するロジックを配置
                let unitText = "";
                if (selectedUnits.length === 1) {
                    unitText = selectedUnits[0];
                } else if (selectedUnits.length > 1) {
                    unitText = `${selectedUnits[0]} 他（混合問題）`;
                }

                let headerHTML = `
                    <div class="title">算数プリント（${gradeText}・${levelText}）</div>
                    <div style="font-size: 16px; font-weight: bold; text-align: center; margin-top: -10px; margin-bottom: 15px; color: #444;">単元：${unitText}</div>
                    <table class="header-table">
                        <tr>
                            <td style="width: 25%;">年　　組　　番</td>
                            <td style="width: 50%;">なまえ：</td>
                            <td style="width: 25%; text-align: center;">得点：　　　／100</td>
                        </tr>
                    </table>
                    <div class="question-list" id="q-list-${p}"></div>
                `;                qPage.innerHTML = headerHTML;
                previewArea.appendChild(qPage);
                
                // 2. 解答ページの生成
                const aPage = document.createElement("div");
                aPage.className = "print-page ans-page";
                let ansHeaderHTML = `
                    <div class="ans-title">【こたえ】算数プリント（${gradeText}・${levelText}）</div>
                    <div class="question-list" id="a-list-${p}"></div>
                `;
                aPage.innerHTML = ansHeaderHTML;
                
                const qListContainer = qPage.querySelector(`#q-list-${p}`);
                const aListContainer = aPage.querySelector(`#a-list-${p}`);
                
                // A4はみ出しを防ぐため、1列化フラグを検知する変数
                let hasWideQuestion = false;
                const pageQuestions = [];
                
                // 問題の生成とフラグチェック
                for (let i = 0; i < qCount; i++) {
                    // 複数単元が選ばれている場合はランダムにシャッフルして出題
                    const targetUnit = selectedUnits[Math.floor(Math.random() * selectedUnits.length)];
                    const qObj = createSingleQuestion(grade, targetUnit, level);
                    
                    if (qObj.isWide) {
                        hasWideQuestion = true;
                    }
                    pageQuestions.push(qObj);
                }
                
                // 【仕様適合】isWideフラグが1つでもある、または問題数制限（10問専用）の場合は1列縦並びに強制制御
                if (hasWideQuestion || qCount === 10) {
                    qListContainer.style.gridTemplateColumns = "1fr";
                    aListContainer.style.gridTemplateColumns = "1fr";
                } else {
                    qListContainer.style.gridTemplateColumns = "1fr 1fr";
                    aListContainer.style.gridTemplateColumns = "1fr 1fr";
                }
                
                // 【修正】1列化（Wide）または問題数が多い場合に、縦幅を最適化して10問すべてを1ページに収める
                let rowGap = "clamp(15px, 4vh, 35px)";
                let itemPadding = "12px 0";
                
                if (hasWideQuestion || qCount === 10) {
                    // 1列化専用のタイトな余白設定（はみ出しを完全に防止）
                    rowGap = "clamp(10px, 2.5vh, 18px)";
                    itemPadding = "8px 0";
                } else if (qCount > 14) {
                    rowGap = "clamp(8px, 2vh, 16px)";
                    itemPadding = "6px 0";
                }
                qListContainer.style.rowGap = rowGap;
                aListContainer.style.rowGap = rowGap;
                
                // HTML要素への流し込み
                pageQuestions.forEach((qObj, index) => {
                    const qItem = document.createElement("div");
                    qItem.className = "q-item";
                    qItem.style.padding = itemPadding;
                    
                    // 問題番号の付与
                    const numSpan = `<span style="font-weight: bold; margin-right: 12px; display: inline-block; width: 40px; text-align: right;">(${index + 1})</span>`;
                    
                    if (qObj.isHTML) {
                        qItem.innerHTML = `${numSpan}<div style="display: inline-block; vertical-align: middle;">${qObj.text}</div>`;
                    } else {
                        qItem.innerHTML = `${numSpan}${qObj.text}`;
                    }
                    qListContainer.appendChild(qItem);
                    
                    // 解答の流し込み
                    const aItem = document.createElement("div");
                    aItem.className = "q-item ans-item";
                    aItem.style.padding = itemPadding;
                    
                    if (qObj.isHTML || String(qObj.ans).includes("span")) {
                        aItem.innerHTML = `${numSpan}<div style="display: inline-block; vertical-align: middle;">${qObj.ans}</div>`;
                    } else {
                        aItem.innerHTML = `${numSpan}${qObj.ans}`;
                    }
                    aListContainer.appendChild(aItem);
                });
                
                // 解答ページを問題ページのすぐ後ろにセット（印刷時に「問題➔解答」の順で出力されるよう制御）
                previewArea.appendChild(aPage);
            }
            
            // プレビュー生成後、即座にブラウザの標準印刷・PDF出力ダイアログを起動
            setTimeout(() => {
                window.print();
            }, 300);
        }

        function validateQuestionCount() {
            const level = document.getElementById("level-select").value;
            const qCountSelect = document.getElementById("question-count-select");
            const checkedBoxes = document.querySelectorAll('input[name="unit-choice"]:checked');
            const selectedUnits = Array.from(checkedBoxes).map(cb => cb.value);

            // 【修正】4年生の四則混合Lv4、見積もり全Lvに加え、5年生の「公倍数・公約数の暗算」も常に10問（1列レイアウト）制限の対象にします
            // 【修正】6年生のわり算Lv4、比の計算Lv3・4も自動的に10問（1列レイアウト）制限の対象にします
            // 【新設統合】新たに追加された3〜6年生の長文・特殊レイアウト単元も自動的に10問制限の対象に統合します
            const isRestricted = 
                (selectedUnits.some(u => u.includes("四則混合")) && level === "4") || 
                selectedUnits.some(u => u.includes("見積もり")) ||
                selectedUnits.some(u => u.includes("公倍数・公約数")) ||
                (selectedUnits.some(u => u.includes("分数のわり算")) && level === "4") ||
                (selectedUnits.some(u => u.includes("比の計算")) && (level === "3" || level === "4")) ||
                selectedUnits.some(u => u.includes("混合計算")) ||
                selectedUnits.some(u => u.includes("複雑な四則混合")) ||
                selectedUnits.some(u => u.includes("あまりのあるわり算のたしかめ")) || // 3年新設
                (selectedUnits.some(u => u.includes("小数の乗除筆算")) && level === "4") || // 4年新設Lv4
                selectedUnits.some(u => u.includes("単位の換算と計算")) || // 5年新設
                selectedUnits.some(u => u.includes("比例の関係と代入計算")); // 【修正】全レベルで10問制限の対象にする

            Array.from(qCountSelect.options).forEach(option => {
                const val = parseInt(option.value);
                if (isRestricted && val > 10) {
                    option.style.display = "none";
                    option.disabled = true;
                } else {
                    option.style.display = "block";
                    option.disabled = false;
                }
            });

            if (isRestricted && parseInt(qCountSelect.value) > 10) {
                qCountSelect.value = "10";
            }
        }



        // 初期化処理：ページ読み込み時に一番最初の学年（小1）の単元リストを構築
        window.onload = function() {
            updateUnits();
        };

    </script>
